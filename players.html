<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Profiles | Scrabble Lanka Championship 2026</title><style>body{font-family:Arial;margin:0;background:#f4f1e8;color:#17202a}header{background:#294d34;color:#fff;padding:30px;text-align:center}main{max-width:900px;margin:25px auto;padding:0 15px}.card{background:#fffdf8;padding:22px;border-radius:14px;box-shadow:0 6px 20px #0001}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:12px}.player{display:block;padding:13px;margin-top:8px;background:#eee5d4;border-radius:8px;text-decoration:none;color:#294d34;font-weight:700}.hint{color:#667078;font-size:14px}</style></head><body><header><h1 id="title">Player Profiles</h1><div id="date">Scrabble Lanka Championship 2026</div></header><main><div class="card"><h2>Find a Player</h2><select id="event" onchange="loadPlayers()"><option value="championship">🏆 Championship — 16 Rounds</option><option value="plate">🥉 Plate Event — 7 Rounds</option><option value="u12">🌟 Under 12 Event — 6 Rounds</option></select><input id="q" placeholder="Search player name..." oninput="render()"><div id="list"><p class="hint">Loading player profiles…</p></div></div></main><script src="player-data.js"></script><script>let db={players:{}};async function loadPlayers(){const e=document.getElementById('event').value;try{db=await getDatabase(e);document.getElementById('title').textContent=e==='championship'?'Scrabble Lanka Championship — Players':e==='plate'?'Scrabble Lanka Plate Event — Players':'Scrabble Lanka Under 12 Event — Players';document.getElementById('date').textContent=e==='plate'?'27th August 2026':e==='u12'?'26th August 2026':'26th & 27th August 2026';render()}catch(err){console.error(err);document.getElementById('list').innerHTML='<p class="hint">Player data is not available yet.</p>'}}function render(){const q=document.getElementById('q').value.toLowerCase(),l=document.getElementById('list');const e=document.getElementById('event').value;const ps=Object.values(db.players).filter(p=>p.name&&p.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));l.innerHTML=ps.map(p=>`<a class="player" href="player.html?event=${e}&id=${encodeURIComponent(p.id)}">${p.name}</a>`).join('')||'<p class="hint">No matching player found yet. Player profiles appear as standings are published.</p>'}loadPlayers();</script></body></html>
