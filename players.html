<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Players | Scrabble Lanka Championship 2026</title><style>body{font-family:Arial;margin:0;background:#f4f1e8;color:#17202a}header{background:#294d34;color:#fff;padding:30px;text-align:center}main{max-width:900px;margin:25px auto;padding:0 15px}.card{background:#fffdf8;padding:22px;border-radius:14px;box-shadow:0 6px 20px #0001}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;font-size:16px}.player{display:block;padding:13px;margin-top:8px;background:#eee5d4;border-radius:8px;text-decoration:none;color:#294d34;font-weight:700}</style></head><body><header><h1>Scrabble Lanka Championship 2026</h1><div>Player Profiles</div></header><main><div class="card"><h2>Find a Player</h2><input id="q" placeholder="Search player name..." oninput="filter()"><div id="list"><p>Player profiles will appear here as results are published.</p></div></div></main><script>let players=[];function filter(){let q=document.getElementById('q').value.toLowerCase(),l=document.getElementById('list');l.innerHTML=players.filter(p=>p.toLowerCase().includes(q)).map(p=>`<a class="player" href="player.html?name=${encodeURIComponent(p)}">${p}</a>`).join('')||'<p>No matching player found.</p>}</script></body></html>
