<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Profile | Scrabble Lanka Championship 2026</title><style>body{font-family:Arial;margin:0;background:#f4f1e8;color:#17202a}header{background:#294d34;color:#fff;padding:28px 16px;text-align:center}main{max-width:1000px;margin:22px auto;padding:0 15px}.card{background:#fffdf8;padding:20px;border-radius:14px;box-shadow:0 6px 20px #0001;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{background:#eee5d4;padding:14px;border-radius:10px}.stat b{display:block;font-size:22px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}.win{color:#285737;font-weight:800}.loss{color:#9d3d2a;font-weight:800}.tie{color:#806a2c;font-weight:800}a{color:#294d34;font-weight:700}.small{font-size:13px;color:#667078}</style></head><body><header><h1 id="name">Player Profile</h1><div id="eventTitle">Scrabble Lanka Championship 2026</div></header><main><div class="card"><div class="stats"><div class="stat"><b id="played">0</b>Games Played</div><div class="stat"><b id="wins">0</b>Wins</div><div class="stat"><b id="losses">0</b>Losses</div><div class="stat"><b id="ties">0</b>Ties</div><div class="stat"><b id="winpct">0%</b>Win %</div><div class="stat"><b id="total">0</b>Total Score</div><div class="stat"><b id="avg">0</b>Average Score</div><div class="stat"><b id="spread">0</b>Total Spread</div></div></div><div class="card"><h2>Game History</h2><div class="tablewrap"><table><thead><tr><th>Round</th><th>Opponent</th><th>Score</th><th>Opp. Score</th><th>Result</th><th>Spread</th></tr></thead><tbody id="games"></tbody></table></div></div><div class="card"><h2>Head-to-Head</h2><div class="tablewrap"><table><thead><tr><th>Opponent</th><th>Games</th><th>Wins</th><th>Losses</th><th>Ties</th><th>Spread</th></tr></thead><tbody id="h2h"></tbody></table></div></div><div class="card"><a id="back" href="players.html">← Back to Players</a></div></main><script>const params=new URLSearchParams(location.search),event=params.get('event')||'championship',id=params.get('id');const titles={championship:'Scrabble Lanka Championship 2026',plate:'Scrabble Lanka Plate Event 2026',u12:'Scrabble Lanka Under 12 Event 2026'};document.getElementById('eventTitle').textContent=titles[event]||titles.championship;document.getElementById('back').href='players.html?event='+event;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const r=await fetch('data/'+event+'.json?x='+Date.now());const db=await r.json(),p=db.players[id];if(!p){document.getElementById('name').textContent='Player not found';return}document.getElementById('name').textContent=p.name;const games=(p.games||[]).sort((a,b)=>a.round-b.round);let w=0,l=0,t=0,total=0,spread=0;for(const g of games){if(g.result==='W')w++;else if(g.result==='L')l++;else t++;total+=g.score;spread+=g.spread}document.getElementById('played').textContent=games.length;document.getElementById('wins').textContent=w;document.getElementById('losses').textContent=l;document.getElementById('ties').textContent=t;document.getElementById('winpct').textContent=games.length?Math.round(w/games.length*100)+'%':'0%';document.getElementById('total').textContent=total.toLocaleString();document.getElementById('avg').textContent=games.length?(total/games.length).toFixed(1):'0';document.getElementById('spread').textContent=(spread>=0?'+':'')+spread;document.getElementById('games').innerHTML=games.map(g=>`<tr><td>${g.round}</td><td><a href="player.html?event=${event}&id=${encodeURIComponent(g.opponentId)}">${esc(g.opponentName||('Player #'+g.opponentId))}</a></td><td>${g.score}</td><td>${g.opponentScore}</td><td class="${g.result==='W'?'win':g.result==='L'?'loss':'tie'}">${g.result}</td><td>${g.spread>=0?'+':''}${g.spread}</td></tr>`).join('')||'<tr><td colspan="6">No completed games yet.</td></tr>';const map={};for(const g of games){let x=map[g.opponentId]||{name:g.opponentName||('Player #'+g.opponentId),games:0,wins:0,losses:0,ties:0,spread:0};x.games++;if(g.result==='W')x.wins++;else if(g.result==='L')x.losses++;else x.ties++;x.spread+=g.spread;map[g.opponentId]=x}document.getElementById('h2h').innerHTML=Object.values(map).sort((a,b)=>b.games-a.games||a.name.localeCompare(b.name)).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.games}</td><td>${x.wins}</td><td>${x.losses}</td><td>${x.ties}</td><td>${x.spread>=0?'+':''}${x.spread}</td></tr>`).join('')||'<tr><td colspan="6">No head-to-head data yet.</td></tr>'}load().catch(e=>{document.getElementById('name').textContent='Player data unavailable';console.error(e)});</script></body></html>
