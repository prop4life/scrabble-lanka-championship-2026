<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scrabble Lanka Championship 2026 | Results</title><style>:root{--bg:#f4f1e8;--ink:#17202a;--green:#294d34;--gold:#d5aa45;--card:#fffdf8;--muted:#687078}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,#18251d,#36583e 55%,#874a2c);color:#fff;text-align:center;padding:36px 16px}.tiles span{display:inline-flex;width:38px;height:38px;margin:2px;background:#e7c86b;color:#3c2d16;border-radius:5px;align-items:center;justify-content:center;font-weight:800;box-shadow:0 3px #9b7730}h1{font-size:clamp(28px,6vw,50px);margin:14px 0 7px}.sub{opacity:.9}.wrap{max-width:1100px;margin:auto;padding:22px 15px 45px}.notice,.round{background:var(--card);border-radius:14px;box-shadow:0 8px 25px #0001}.notice{padding:16px 18px;border-left:5px solid var(--gold);margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.round{padding:17px;border:1px solid #eee4d1}.round h2{margin:0 0 5px}.round small{color:var(--muted)}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}a{padding:10px 12px;border-radius:8px;text-decoration:none;font-weight:700;font-size:14px}.p{background:#eee5d4;color:#4c351b}.s{background:var(--green);color:white}.admin{display:inline-block;margin-top:15px;background:#fff;color:#294d34;padding:11px 18px;border-radius:9px;text-decoration:none;font-weight:800}footer{text-align:center;color:var(--muted);padding:22px;font-size:13px}</style></head><body><header><div class="tiles"><span>S</span><span>C</span><span>R</span><span>A</span><span>B</span><span>B</span><span>L</span><span>E</span></div><h1>Scrabble Lanka Championship 2026</h1><div class="sub">Official Tournament Pairings &amp; Standings</div><a class="admin" href="admin.html">Tournament Update Centre</a></header><main class="wrap"><div class="notice"><strong>Live Results</strong><br>Select a round to view its pairings or standings. Results are updated round-by-round.</div><section class="grid" id="rounds"></section></main><footer>Scrabble Lanka Championship 2026 &bull; Official Results Portal</footer><script>const g=document.getElementById('rounds');for(let i=1;i<=16;i++){let n=String(i).padStart(2,'0');let x=document.createElement('article');x.className='round';x.innerHTML=`<h2>Round ${i}</h2><small>Pairings &amp; Standings</small><div class="buttons"><a class="p" href="rounds/round-${n}-pairings.html">Pairings</a><a class="s" href="rounds/round-${n}-standings.html">Standings</a></div>`;g.appendChild(x)}</script></body></html>
